

<!DOCTYPE html>
<html>
<head>
    <title>TrustVault Login</title>
</head>
<body style="font-family: Arial; text-align:center; background:#eaf0f8; padding:60px;">

    <div style="background:white; padding:30px; width:320px; margin:auto; border-radius:12px;">

        <h1>TrustVault</h1>
        <h3>Secure Document Management System</h3>
        <h2>User Login</h2>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p style="color:red;">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="username"
                   placeholder="Enter Username" required>

            <br><br>

            <input type="password" name="password"
                   placeholder="Enter Password" required>

            <br><br>

            <button type="submit">Login</button>

        </form>
        

    </div>

</body>
</html>
