
<!DOCTYPE html>
<html>
<head>
    <title>TrustVault - Edit Document</title>
</head>

<body style="font-family:Arial; background:#eaf0f8; padding:40px;">

    <div style="background:white; padding:30px; max-width:500px; margin:auto; border-radius:12px;">

        <h1>TrustVault</h1>
        <h2>Update Document</h2>

        <p><b>Current File:</b> {{ document["filename"] }}</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p style="color:red;">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Select Updated PDF or Word Document:</label>
            <br><br>

            <input
                type="file"
                name="document"
                accept=".pdf,.doc,.docx"
                required
            >

            <br><br>

            <button type="submit">Update Document</button>

        </form>

        <br>

        <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>

    </div>

</body>
</html>
